tags:
  - GlintReach
operationId: update-glint-reach-brand-profile
summary: 'Create or update the account brand profile'
description: 'Creates the brand profile on first save and updates it afterwards. One profile per account.'
security:
  - userBearerAuth: []
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/glint_reach_brand_profile_payload'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            brand_profile:
              $ref: '#/components/schemas/glint_reach_brand_profile'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Invalid input'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
