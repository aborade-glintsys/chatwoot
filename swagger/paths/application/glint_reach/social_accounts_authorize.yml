tags:
  - GlintReach
operationId: glint-reach-social-accounts-authorize
summary: 'Start social OAuth authorization'
description: 'Creates a single-use server-side OAuth state + PKCE pair, sets a browser-binding HttpOnly cookie and returns the provider authorization URL.'
security:
  - userBearerAuth: []
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required: [provider]
        properties:
          provider:
            type: string
            enum: [linkedin]
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            url:
              type: string
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Provider unconfigured or Active Record Encryption keys missing'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
