tags:
  - GlintReach
operationId: create-glint-reach-campaign
summary: 'Create a GlintReach campaign'
description: 'Creates a draft campaign. The account and creator are taken from the request context.'
security:
  - userBearerAuth: []
  - userApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/glint_reach_campaign_payload'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/glint_reach_campaign'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Invalid input, invalid status transition, or campaign is completed/archived'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
