tags:
  - GlintReach
operationId: update-glint-reach-asset
summary: 'Update or replace a campaign asset'
description: 'Updates alt text and/or replaces the file. Variant links are kept.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: campaign_id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
  - in: path
    name: id
    schema:
      type: integer
    required: true
    description: 'Asset ID'
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          file:
            type: string
            format: binary
            description: JPEG, PNG, WebP or GIF; max 10 MB; 200-8192 px per side; max 40 MP. Type is detected from the file contents
          alt_text:
            type: string
            maxLength: 1000
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/glint_reach_asset'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Invalid file or locked campaign'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
