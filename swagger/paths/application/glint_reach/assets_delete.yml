tags:
  - GlintReach
operationId: delete-glint-reach-asset
summary: 'Delete a campaign asset'
description: 'Removes the asset from all variants and purges the file.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: campaign_id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
  - in: path
    name: id
    schema:
      type: integer
    required: true
    description: 'Asset ID'
responses:
  '200':
    description: 'Deleted'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Locked campaign'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
