tags:
  - GlintReach
operationId: glint-reach-variant-approvals
summary: 'List variant approvals'
description: 'Approval decisions for the variant, newest first.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: campaign_id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
  - in: path
    name: content_item_id
    schema:
      type: integer
    required: true
    description: 'Content item ID'
  - in: path
    name: id
    schema:
      type: integer
    required: true
    description: 'Variant ID'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            payload:
              type: array
              items:
                $ref: '#/components/schemas/glint_reach_approval'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
