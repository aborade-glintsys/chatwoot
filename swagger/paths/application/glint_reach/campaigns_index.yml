tags:
  - GlintReach
operationId: list-glint-reach-campaigns
summary: 'List GlintReach campaigns'
description: 'Paginated (25 per page), newest first. Archived campaigns are excluded unless `status=archived`.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
    description: 'Page number, defaults to 1'
  - in: query
    name: status
    schema:
      type: string
      enum: [draft, active, paused, completed, archived]
    description: 'Filter by status'
  - in: query
    name: search
    schema:
      type: string
    description: 'Case-insensitive match on campaign name'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            meta:
              type: object
              properties:
                count:
                  type: integer
                current_page:
                  type: integer
            payload:
              type: array
              items:
                $ref: '#/components/schemas/glint_reach_campaign'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Invalid input, invalid status transition, or campaign is completed/archived'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
