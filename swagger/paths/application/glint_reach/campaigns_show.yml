tags:
  - GlintReach
operationId: get-glint-reach-campaign
summary: 'Get a GlintReach campaign'
description: 'Returns the campaign with its content items and variants.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/glint_reach_campaign'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
