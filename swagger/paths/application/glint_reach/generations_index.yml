tags:
  - GlintReach
operationId: list-glint-reach-generations
summary: 'List AI generations'
description: 'Returns the 20 most recent AI generations for the campaign.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: campaign_id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            payload:
              type: array
              items:
                $ref: '#/components/schemas/glint_reach_generation'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
