tags:
  - GlintReach
operationId: get-glint-reach-brand-profile
summary: 'Get the account brand profile'
description: 'Returns the brand profile of the account, or null when none exists.'
security:
  - userBearerAuth: []
  - userApiKey: []
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            brand_profile:
              oneOf:
                - $ref: '#/components/schemas/glint_reach_brand_profile'
                - type: 'null'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
