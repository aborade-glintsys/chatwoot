tags:
  - GlintReach
operationId: glint-reach-social-providers
summary: 'List social providers'
description: 'Lists supported social providers with configuration status, approval notes and capabilities.'
security:
  - userBearerAuth: []
  - userApiKey: []
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            payload:
              type: array
              items:
                type: object
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
