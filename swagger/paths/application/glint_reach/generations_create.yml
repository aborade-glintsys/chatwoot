tags:
  - GlintReach
operationId: create-glint-reach-generation
summary: 'Request an AI generation'
description: 'Validates and queues an AI generation. Poll GET /glint_reach/generations/{id} for the outcome.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: campaign_id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '#/components/schemas/glint_reach_generation_payload'
responses:
  '202':
    description: 'Queued'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/glint_reach_generation'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'AI not configured, campaign locked, invalid or approved target, invalid instruction, or already running'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
