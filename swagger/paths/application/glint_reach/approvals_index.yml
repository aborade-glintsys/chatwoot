tags:
  - GlintReach
operationId: glint-reach-approval-queue
summary: 'Approval queue'
description: 'Variants waiting for review, oldest submission first, 25 per page.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          type: object
          properties:
            meta:
              type: object
            payload:
              type: array
              items:
                $ref: '#/components/schemas/glint_reach_content_variant'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
