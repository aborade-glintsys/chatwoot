tags:
  - GlintReach
operationId: archive-glint-reach-campaign
summary: 'Archive a GlintReach campaign'
description: 'Safe deletion: archives the campaign (allowed from draft, paused or completed). Records are kept.'
security:
  - userBearerAuth: []
  - userApiKey: []
parameters:
  - in: path
    name: id
    schema:
      type: integer
    required: true
    description: 'Campaign ID'
responses:
  '200':
    description: 'Success'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/glint_reach_campaign'
  '401':
    description: 'Unauthenticated, not an account administrator, or not a member of the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '403':
    description: 'GlintReach is not enabled for the account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '404':
    description: 'Resource not found in this account'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '422':
    description: 'Invalid input, invalid status transition, or campaign is completed/archived'
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
