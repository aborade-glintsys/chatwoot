type: object
required: [generation]
properties:
  generation:
    type: object
    required: [kind]
    properties:
      kind:
        type: string
        enum: [strategy, content_plan, content_item, variants, rewrite, suggestions]
      content_item_id:
        type: integer
        description: Required for `variants`
      content_variant_id:
        type: integer
        description: Required for `rewrite` and `suggestions`
      count:
        type: integer
        minimum: 1
        maximum: 10
        description: Items for `content_plan` (default 5)
      instruction:
        type: string
        maxLength: 500
        description: Required for `rewrite`
      platforms:
        type: array
        items:
          type: string
          enum: [facebook, instagram, linkedin, x, tiktok]
        description: For `variants`; defaults to the campaign channels
