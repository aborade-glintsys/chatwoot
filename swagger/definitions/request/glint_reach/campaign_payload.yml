type: object
required: [campaign]
properties:
  campaign:
    type: object
    properties:
      name:
        type: string
        maxLength: 255
      objective:
        type: string
        enum: [awareness, engagement, traffic, leads, sales]
      brief:
        type: string
      target_audience:
        type: string
      starts_at:
        type: string
        format: date-time
      ends_at:
        type: string
        format: date-time
        description: Must be after starts_at
