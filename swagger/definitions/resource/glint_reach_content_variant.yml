type: object
properties:
  id:
    type: integer
  content_item_id:
    type: integer
  platform:
    type: string
    enum: [facebook, instagram, linkedin, x, tiktok]
  body:
    type: [string, 'null']
  call_to_action:
    type: [string, 'null']
  hashtags:
    type: array
    items:
      type: string
    description: Stored without the leading '#'
  status:
    type: string
    enum: [draft, ready]
  generation_id:
    type: [integer, 'null']
    description: AI generation that last wrote this variant
  asset_ids:
    type: array
    items:
      type: integer
  assets:
    type: array
    items:
      type: object
      properties:
        id:
          type: integer
        alt_text:
          type: [string, 'null']
        thumbnail_url:
          type: string
  created_at:
    type: integer
  updated_at:
    type: integer
